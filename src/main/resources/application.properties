# ===================================================================
# CONFIGURAÇÕES DO BANCO DE DADOS (POSTGRESQL & HIKARI)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Força o dialeto para evitar erros de inicialização caso o banco demore a responder
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# CONFIGURAÇÕES DO JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desativa o Open-In-View para melhorar a performance e fechar as conexões mais cedo
spring.jpa.open-in-view=false

# ===================================================================
# CONFIGURAÇÕES DE PAGINAÇÃO DA API
# ===================================================================
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# ===================================================================
# CONFIGURAÇÕES DE ERROS E SEGURANÇA (JWT)
# ===================================================================
# Esconde o Stacktrace completo nas respostas HTTP para segurança da API
server.error.include-stacktrace=never

# Chave secreta para assinatura dos Tokens JWT
jwt.secret=minha_palavra_secreta

# ===================================================================
# CONFIGURAÇÕES CUSTOMIZADAS DO SWAGGER / SPRINGDOC
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Força o Swagger UI a enviar as requisições para a URL pública do Codespaces
springdoc.openapi.servers[0].url=https://symmetrical-broccoli-7wxrp6r59g5cr7r6-8080.app.github.dev
springdoc.openapi.servers[0].description=Ambiente GitHub Codespaces